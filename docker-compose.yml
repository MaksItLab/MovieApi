services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movie_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_api"]
      interval: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/health"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: MovieApi.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=movie_api;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      Minio__InternalEndpoint: minio:9000
      Minio__ExternalEndpoint: 127.0.0.1:9000
      Minio__Region: us-east-1
      Minio__AccessKey: minioadmin
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  seq_data:
  minio_data: